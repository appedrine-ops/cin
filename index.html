<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1013">
<title>Cin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column, full-height vertical snap feed; search + menu float on top; tools and profile open as bottom sheets. Single dark look by choice. */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
button, input, textarea { font: inherit; color: inherit; }
ul, ol { list-style: none; }
:root {
  --ink: #0a1013;
  --ink-2: #131c21;
  --line: #243139;
  --paper: #f3efe6;
  --mute: #93a1a8;
  --saffron: #f2b544;
  --coral: #ff6b5b;
  --display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--paper); font-family: var(--body); font-size: 14px; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; text-align: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible, label:focus-within { outline: 2px solid var(--saffron); outline-offset: 2px; }
a { color: inherit; text-decoration: none; }
#app { position: relative; height: 100%; max-width: 440px; margin: 0 auto; background: #000; overflow: hidden; border-inline: 1px solid var(--line); }

#top { position: absolute; z-index: 5; inset: 0 0 auto 0; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 30px; background: linear-gradient(rgba(0,0,0,.6), transparent); pointer-events: none; }
#top > * { pointer-events: auto; }
.toprow { display: flex; align-items: center; gap: 10px; }
.logo { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 2px; }
.logo i { width: 7px; height: 7px; border-radius: 50%; background: var(--saffron); display: inline-block; }
.search { position: relative; flex: 1; min-width: 0; display: block; }
.search svg { position: absolute; left: 12px; top: 50%; width: 16px; height: 16px; margin-top: -8px; fill: none; stroke: var(--mute); stroke-width: 2; stroke-linecap: round; pointer-events: none; }
.search input { width: 100%; min-width: 0; -webkit-appearance: none; appearance: none; background: rgba(10,16,19,.65); color: var(--paper); border: 1px solid rgba(243,239,230,.2); border-radius: 999px; padding: 9px 12px 9px 36px; font: inherit; }
.search input::placeholder { color: var(--mute); }
.add { flex: none; width: 38px; height: 38px; border-radius: 12px; background: var(--saffron); color: var(--ink); display: grid; place-items: center; }
.add svg { width: 20px; height: 20px; }
.tabs { display: flex; justify-content: center; gap: 22px; font-family: var(--display); font-weight: 600; font-size: 15px; pointer-events: none; }
.tabs button { color: rgba(243,239,230,.6); padding-block: 4px; border-bottom: 2px solid transparent; pointer-events: auto; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.tabs button[aria-selected="true"] { color: var(--paper); border-color: var(--saffron); }
.pill { position: absolute; z-index: 6; left: 50%; top: 104px; transform: translateX(-50%); background: var(--paper); color: var(--ink); font-weight: 600; padding: 8px 16px; border-radius: 999px; box-shadow: 0 4px 16px rgba(0,0,0,.4); }

#feed { height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain; }
#feed::-webkit-scrollbar { display: none; }
.slide { position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; background: #000; }
.slide canvas, .slide video, .slide img.m { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.slide img.m.contain { object-fit: contain; }
.scrim { position: absolute; inset: auto 0 0 0; height: 46%; background: linear-gradient(transparent, rgba(0,0,0,.72)); pointer-events: none; }
.subs { position: absolute; left: 16px; right: 84px; bottom: 36%; text-align: center; pointer-events: none; }
.subs span { display: inline; background: rgba(0,0,0,.6); padding: 3px 9px; border-radius: 6px; font-weight: 600; font-size: 16px; line-height: 1.7; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

.meta { position: absolute; left: 16px; right: 84px; bottom: 26px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.avatar { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; color: var(--ink); }
.handle { font-family: var(--display); font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.follow { margin-left: 2px; padding: 5px 12px; border-radius: 999px; border: 1.5px solid var(--paper); font-weight: 600; font-size: 12px; }
.follow[aria-pressed="true"] { background: rgba(243,239,230,.18); border-color: transparent; }
.cap { line-height: 1.4; max-width: 34ch; overflow-wrap: anywhere; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: rgba(10,16,19,.55); border: 1px solid rgba(243,239,230,.22); }
.tag.sample { color: var(--saffron); border-color: rgba(242,181,68,.5); }

.rail { position: absolute; right: 10px; bottom: 30px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.act { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 54px; font-size: 12px; font-weight: 600; text-shadow: 0 1px 6px rgba(0,0,0,.6); font-variant-numeric: tabular-nums; text-align: center; }
.act .ic { width: 46px; height: 46px; border-radius: 50%; background: rgba(10,16,19,.5); backdrop-filter: blur(6px); display: grid; place-items: center; transition: transform .15s; }
.act:active .ic { transform: scale(.9); }
.act svg { width: 24px; height: 24px; fill: none; stroke: var(--paper); stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
.act[aria-pressed="true"] svg { fill: var(--coral); stroke: var(--coral); }
.act[data-act="save"][aria-pressed="true"] svg { fill: var(--saffron); stroke: var(--saffron); }

.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(243,239,230,.18); }
.bar i { display: block; height: 100%; width: 0; background: var(--saffron); }
.pausebadge { position: absolute; inset: 0; display: none; place-items: center; pointer-events: none; }
.slide[data-paused="1"] .pausebadge { display: grid; }
.pausebadge span { width: 72px; height: 72px; border-radius: 50%; background: rgba(0,0,0,.45); display: grid; place-items: center; }
.pausebadge svg { width: 30px; height: 30px; fill: var(--paper); }
.burst { position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px; pointer-events: none; animation: pop .7s ease-out forwards; }
.burst svg { width: 100%; height: 100%; fill: var(--coral); }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 25% { transform: scale(1.1); opacity: 1; } 100% { transform: translateY(-40px) scale(1); opacity: 0; } }
.mute { position: absolute; right: 12px; top: 118px; width: 36px; height: 36px; border-radius: 50%; background: rgba(10,16,19,.5); display: none; place-items: center; }
.slide[data-kind="video"] .mute { display: grid; }
.mute svg { width: 18px; height: 18px; fill: none; stroke: var(--paper); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.empty { height: 100%; display: grid; place-content: center; text-align: center; gap: 10px; padding: 32px; background: var(--ink); }
.empty h2 { font-family: var(--display); font-size: 24px; margin: 0; text-wrap: balance; }
.empty p { margin: 0; color: var(--mute); max-width: 30ch; margin-inline: auto; line-height: 1.5; }

.backdrop { position: absolute; inset: 0; z-index: 8; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .2s; }
.backdrop.on { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; z-index: 9; left: 0; right: 0; bottom: 0; max-height: 88%; display: flex; flex-direction: column; background: var(--ink-2); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; transform: translateY(105%); visibility: hidden; transition: transform .25s ease, visibility 0s .25s; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet.on { transform: none; visibility: visible; transition: transform .25s ease; }
.sheet header { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 10px; }
.sheet h3 { margin: 0; font-family: var(--display); font-size: 18px; }
.close { color: var(--mute); font-size: 22px; line-height: 1; padding: 4px 8px; }
.sbody { overflow-y: auto; padding: 4px 16px 18px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.clist { overflow-y: auto; padding: 4px 16px 12px; display: flex; flex-direction: column; gap: 14px; min-height: 80px; }
.c { display: grid; grid-template-columns: 30px 1fr; gap: 10px; }
.c .avatar { width: 30px; height: 30px; font-size: 13px; }
.c b { font-weight: 600; font-size: 13px; color: var(--mute); }
.c p { margin: 2px 0 0; line-height: 1.4; overflow-wrap: anywhere; }
.row { display: flex; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--line); }
input[type="text"], input[type="email"], input[type="password"], textarea { flex: 1; min-width: 0; width: 100%; background: var(--ink); color: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; font: inherit; }
textarea { resize: vertical; line-height: 1.4; }
.row input[type="text"] { width: auto; }
.btn { background: var(--saffron); color: var(--ink); font-weight: 600; padding: 0 16px; border-radius: 12px; min-height: 42px; text-align: center; }
.btn.ghost { background: transparent; color: var(--paper); border: 1px solid var(--line); }
.btn[disabled] { opacity: .45; cursor: default; }
.lbl { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); display: block; margin-bottom: 6px; }
.drop { position: relative; display: block; border: 1.5px dashed var(--line); border-radius: 14px; padding: 16px; text-align: center; cursor: pointer; color: var(--mute); overflow-wrap: anywhere; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop strong { color: var(--paper); display: block; margin-bottom: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.chips.off { opacity: .4; pointer-events: none; }
.note { color: var(--mute); font-size: 12px; margin: 0; line-height: 1.45; }
.err { color: var(--coral); font-size: 13px; margin: 0; min-height: 1em; }
.mrow { display: flex; flex-direction: column; gap: 3px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--ink); }
.mrow b { font-family: var(--display); font-size: 17px; font-weight: 600; }
.mrow span { color: var(--mute); line-height: 1.4; }
.mrow:active { background: #0f171b; }
.pv { border-radius: 12px; overflow: hidden; background: #000; display: flex; justify-content: center; }
.pv img, .pv video, .pv canvas { max-width: 100%; max-height: 260px; display: block; }
.stage { border-radius: 12px; overflow: hidden; display: flex; justify-content: center; background: repeating-conic-gradient(#1b252b 0% 25%, #141c21 0% 50%) 0 0 / 16px 16px; }
.stage canvas { max-width: 100%; max-height: 300px; display: block; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field .top { display: flex; justify-content: space-between; color: var(--mute); font-size: 12px; }
input[type="range"] { width: 100%; accent-color: var(--saffron); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--ink); border: 1px solid var(--line); color: var(--saffron); }
.cues { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--mute); font-variant-numeric: tabular-nums; }
.cues b { color: var(--paper); font-weight: 500; }
.sgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.sopt { display: flex; align-items: center; gap: 10px; padding: 14px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--ink); font-weight: 600; min-width: 0; }
.sopt svg { flex: none; width: 22px; height: 22px; fill: none; stroke: var(--saffron); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sopt[aria-pressed="true"] { border-color: var(--saffron); }
.sopt.danger svg { stroke: var(--coral); }
.prof { display: flex; align-items: center; gap: 14px; }
.prof .avatar { width: 64px; height: 64px; font-size: 26px; }
.prof .fields { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.stats { display: flex; gap: 22px; }
.stats div { display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
.stats b { font-family: var(--display); font-size: 20px; }
.stats span { color: var(--mute); font-size: 12px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.tile { position: relative; aspect-ratio: 9 / 14; border-radius: 8px; overflow: hidden; background: #000; display: block; }
.tile canvas, .tile img, .tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile span { position: absolute; left: 6px; bottom: 5px; right: 6px; font-size: 11px; font-weight: 600; text-shadow: 0 1px 4px #000; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#toast { position: absolute; z-index: 12; left: 50%; top: 100px; transform: translate(-50%, -10px); background: var(--paper); color: var(--ink); font-weight: 600; padding: 8px 14px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: 80%; text-align: center; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .sheet, .backdrop, #toast { transition: none; } .burst { animation-duration: .01s; } }
</style>
</head>
<body>

<div id="app">
  <div id="top">
    <div class="toprow">
      <div class="logo">Cin<i></i></div>
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="q" type="search" placeholder="Search creators and tags" autocomplete="off" aria-label="Search Cin"></label>
      <button class="add" id="openMenu" aria-label="Post or create"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="tabs" role="tablist" aria-label="Feed">
      <button role="tab" id="tab-for" aria-selected="true">For you</button>
      <button role="tab" id="tab-fol" aria-selected="false">Following</button>
    </div>
  </div>
  <button class="pill" id="fresh" hidden>New posts</button>
  <div id="feed" tabindex="-1"><div class="empty"><h2>Opening Cin</h2><p>Connecting to the shared database.</p></div></div>
  <div class="backdrop" id="backdrop"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function () {
  "use strict";
  var DURATION = 12, MAX_POSTS = 200, MAX_COMMENTS = 300;
  var REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function $(id) { return document.getElementById(id); }
  var app = $("app");

  /* ---------- constants ---------- */
  var STYLE_PAL = {
    dunes: ["#2b1a3f", "#f0a05c", "#ffe2a0", "#4a2f58"],
    rain: ["#05070f", "#10243a", "#4de1d2", "#ff8fb1", "#9aa8ff"],
    orbits: ["#10091f", "#2a1250", "#ffd166", "#ef476f", "#06d6a0"],
    tide: ["#061a22", "#0c3a4a", "#2ec4b6", "#cbf3f0", "#ff9f1c"],
    bloom: ["#160b14", "#3b1230", "#ff7aa2", "#ffd6a5", "#a0c4ff"]
  };
  var CO_BG = { ink: "linear-gradient(#0a1013,#1c2a31)", sun: "linear-gradient(#f2b544,#ff6b5b)", sea: "linear-gradient(#0c3a4a,#2ec4b6)" };
  var RESERVED = ["you", "me", "admin", "cin", "support", "api", "system"];

  /* ---------- generative scenes ---------- */
  function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function prep(v) {
    var r = rng(v.seed), parts = [], i;
    for (i = 0; i < 70; i++) parts.push({ x: r(), y: r(), len: 0.04 + r() * 0.12, v: 0.25 + r() * 0.5, c: Math.floor(r() * 3), w: 1 + r() * 2.2, a: 0.35 + r() * 0.6 });
    v.parts = parts;
  }
  function lin(c, w, h, a, b) { var g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, a); g.addColorStop(1, b); c.fillStyle = g; c.fillRect(0, 0, w, h); }
  var DRAW = {
    dunes: function (c, w, h, t, v) {
      var P = v.pal, i, x, y;
      lin(c, w, h, P[0], P[1]);
      var sx = w * 0.5 + Math.sin(t * 0.25) * w * 0.14, sy = h * 0.38 + Math.cos(t * 0.25) * h * 0.02, sr = w * 0.2;
      var g = c.createRadialGradient(sx, sy, 0, sx, sy, sr * 2.2);
      g.addColorStop(0, P[2]); g.addColorStop(0.35, P[2]); g.addColorStop(1, "rgba(255,255,255,0)");
      c.globalAlpha = 0.9; c.fillStyle = g; c.beginPath(); c.arc(sx, sy, sr * 2.2, 0, 6.2832); c.fill(); c.globalAlpha = 1;
      for (i = 0; i < 5; i++) {
        var base = h * (0.46 + i * 0.1), amp = h * 0.045 * (1 + i * 0.3);
        c.beginPath(); c.moveTo(0, h);
        for (x = 0; x <= w + 8; x += 8) {
          y = base + Math.sin(x * 0.007 * (1 + i * 0.25) + t * 0.18 * (i + 1) + v.seed + i * 2) * amp + Math.sin(x * 0.019 + i + t * 0.1) * amp * 0.3;
          c.lineTo(x, y);
        }
        c.lineTo(w, h); c.closePath();
        c.fillStyle = P[3]; c.fill();
        c.fillStyle = "rgba(4,6,10," + (0.12 + i * 0.16) + ")"; c.fill();
      }
    },
    rain: function (c, w, h, t, v) {
      var P = v.pal, i, p, y;
      lin(c, w, h, P[0], P[1]);
      var hz = h * 0.76;
      var g = c.createLinearGradient(0, hz - h * 0.14, 0, hz + h * 0.1);
      g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(0.5, P[2]); g.addColorStop(1, "rgba(0,0,0,0)");
      c.globalAlpha = 0.18; c.fillStyle = g; c.fillRect(0, hz - h * 0.14, w, h * 0.24); c.globalAlpha = 1;
      c.lineCap = "round";
      for (i = 0; i < v.parts.length; i++) {
        p = v.parts[i];
        y = ((p.y + t * p.v * 0.5) % 1.25) - 0.1;
        c.strokeStyle = P[2 + p.c]; c.globalAlpha = p.a; c.lineWidth = p.w;
        c.beginPath(); c.moveTo(p.x * w, y * h); c.lineTo(p.x * w, (y - p.len) * h); c.stroke();
        if (y * h > hz && y * h < hz + 6) { c.globalAlpha = 0.5; c.beginPath(); c.ellipse(p.x * w, hz, 6 + p.w * 3, 2, 0, 0, 6.2832); c.stroke(); }
      }
      c.globalAlpha = 1;
      c.fillStyle = "rgba(5,8,14,.55)"; c.fillRect(0, hz, w, h - hz);
    },
    orbits: function (c, w, h, t, v) {
      var P = v.pal, cx = w / 2, cy = h * 0.44, i;
      lin(c, w, h, P[0], P[1]);
      var g = c.createRadialGradient(cx, cy, 0, cx, cy, w * 0.3);
      g.addColorStop(0, P[2]); g.addColorStop(1, "rgba(255,255,255,0)");
      c.globalAlpha = 0.55; c.fillStyle = g; c.beginPath(); c.arc(cx, cy, w * 0.3, 0, 6.2832); c.fill(); c.globalAlpha = 1;
      for (i = 0; i < 7; i++) {
        var r = w * (0.1 + i * 0.065), a = t * (0.35 + i * 0.12) * (i % 2 ? 1 : -1) + i + v.seed;
        c.strokeStyle = "rgba(255,255,255,.22)"; c.lineWidth = 1;
        c.beginPath(); c.arc(cx, cy, r, 0, 6.2832); c.stroke();
        c.fillStyle = P[2 + (i % 3)];
        c.beginPath(); c.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 4 + i * 0.9, 0, 6.2832); c.fill();
      }
    },
    tide: function (c, w, h, t, v) {
      var P = v.pal, i, x;
      lin(c, w, h, P[0], P[1]);
      for (i = 0; i < 7; i++) {
        var base = h * (0.3 + i * 0.095), amp = h * 0.03;
        c.beginPath(); c.moveTo(0, h);
        for (x = 0; x <= w + 8; x += 8) c.lineTo(x, base + Math.sin(x * 0.012 + t * 0.6 * (1 + i * 0.1) + i * 1.3) * amp + Math.sin(x * 0.03 - t * 0.4 + i) * amp * 0.4);

    var inner;
    if (v.kind === "video") inner = '<video muted playsinline preload="metadata" src="' + esc(v.src) + '#t=0.5"></video>';
    else if (v.kind === "image") inner = '<img alt=""' + (v.src ? ' src="' + esc(v.src) + '"' : "") + ">";
    else inner = "<canvas width='180' height='280'></canvas>";
    a.innerHTML = inner + "<span>" + esc(v.cap) + "</span>";
    var cv = a.querySelector("canvas"); if (cv) { if (!v.parts) prep(v); DRAW[v.type](cv.getContext("2d"), 180, 280, 3, v); }
    return a;
  }
  function renderProfile() {
    var mine = me(), items;
    if (prTab === "posts") items = V.filter(function (v) { return v.mine; });
    else if (prTab === "reposts") items = V.filter(function (v) { return v.reposted; });
    else if (prTab === "saved") items = V.filter(function (v) { return v.saved; });
    else items = V.filter(function (v) { return v.liked; });
    var nFol = cleanArr((D.reactions[UID] || {}).follows).length, followers = 0, k;
    for (k in D.reactions) if (cleanArr(D.reactions[k].follows).indexOf(UID) >= 0) followers++;
    var body = $("prBody");
    if (!UID) { body.innerHTML = '<p class="note">Sign in to see your posts, reposts, saves and likes.</p><button class="btn" id="prSet" type="button">Sign in</button>'; $("prSet").onclick = function () { openAuth("in"); }; return; }
    if (!mine) { body.innerHTML = '<p class="note">Choose a handle to create your profile.</p><button class="btn" id="prSet" type="button">Choose a handle</button>'; $("prSet").onclick = openSetup; return; }
    body.innerHTML = '<div class="prof">' + avatar("@" + mine.handle) + '<div class="fields"><b style="font-family:var(--display);font-size:18px">@' + esc(mine.handle) + '</b><input type="text" id="prName" maxlength="30" value="' + esc(mine.name || "") + '" aria-label="Display name" placeholder="Display name"><input type="text" id="prBio" maxlength="80" value="' + esc(mine.bio || "") + '" aria-label="Bio" placeholder="Add a short bio"></div></div>' +
      '<div class="stats"><div><b>' + V.filter(function (v) { return v.mine; }).length + '</b><span>Posts</span></div><div><b>' + followers + '</b><span>Followers</span></div><div><b>' + nFol + '</b><span>Following</span></div></div>' +
      '<div class="chips" id="prTabs"><button type="button" class="chip" data-v="posts" aria-pressed="' + (prTab === "posts") + '">Posts</button><button type="button" class="chip" data-v="reposts" aria-pressed="' + (prTab === "reposts") + '">Reposts</button><button type="button" class="chip" data-v="saved" aria-pressed="' + (prTab === "saved") + '">Saved</button><button type="button" class="chip" data-v="liked" aria-pressed="' + (prTab === "liked") + '">Liked</button></div>' +
      '<div class="grid" id="prGrid"></div><button class="btn ghost" id="prOut" type="button">Sign out</button>';
    var g = $("prGrid");
    if (!items.length) g.outerHTML = '<p class="note">' + (prTab === "posts" ? "Nothing posted yet. Tap + and choose Post to share your first clip." : "Nothing here yet.") + "</p>";
    else items.forEach(function (v) { g.appendChild(tileFor(v)); });
    function saveProfile() {
      var np = { handle: mine.handle, name: $("prName").value.trim().slice(0, 30) || mine.handle, bio: $("prBio").value.trim().slice(0, 80) };
      D.profiles[UID] = np; enqueue(function () { return sb.from("profiles").update({ name: np.name, bio: np.bio }).eq("id", UID).then(chk); }).catch(writeFail);
    }
    $("prName").addEventListener("change", saveProfile); $("prBio").addEventListener("change", saveProfile);
    $("prOut").onclick = function () { sb.auth.signOut(); };
    chipGroup($("prTabs"), function (v) { prTab = v; renderProfile(); });
  }
  $("prBody").addEventListener("click", function (e) { var t = e.target.closest(".tile"); if (t) { closeSheets(); jumpTo(t.dataset.id); } });

  /* ---------- start ---------- */
  function gate(title, text) { feed.innerHTML = '<div class="empty"><h2>' + esc(title) + "</h2><p>" + esc(text) + "</p></div>"; }
  function start() {
    if (!CFG.url || !CFG.key) { gate("Cin is not connected yet", "Open config.js and paste in your Supabase project URL and public key. The setup guide has the steps."); return; }
    if (!window.supabase || !window.supabase.createClient) { gate("Cin could not load", "The database library did not load. Check your internet connection and reload."); return; }
    sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
    sb.auth.getSession().then(function (r) {
      UID = r.data && r.data.session ? r.data.session.user.id : null;
      return load();
    }).then(function (snap) {
      applySnap(snap); rebuild(); firstRender = true; started = true; render();
      if (UID && !me()) openSetup();
      var h = location.hash.slice(1);
      if (h && h.indexOf("=") < 0) jumpTo(h);
      sb.auth.onAuthStateChange(onAuth); listen();
    }).catch(function () { gate("Cin could not connect", "Check your internet connection and reload the page. If this keeps happening, the setup in config.js or the database may be wrong."); });
  }
  start();
})();
</script>
</body>
</html>
